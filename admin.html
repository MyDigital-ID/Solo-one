<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>لوحة تحكم SOLO SUITS</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#ececed;color:#000;font:500 16px/1.7 'Tajawal','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.muted{color:#5d5d62;font-size:14px}
label{display:grid;gap:6px;font-weight:700;font-size:15px}
input,select,textarea{font:500 16px 'Tajawal',sans-serif;min-height:50px;padding:10px 14px;border:1.5px solid rgba(0,0,0,.28);background:#fff;border-radius:3px;width:100%;color:#000}
input[type=color]{padding:4px;min-height:50px}
input[type=checkbox],input[type=radio]{width:22px;min-height:22px;height:22px;accent-color:#000}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #000;outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 26px;background:#000;color:#fff;font-weight:800;font-size:17px;border-radius:3px}
.btn.big{width:100%}
.btn.line{background:transparent;color:#000;border:1.5px solid #000}
.btn.sm{min-height:42px;padding:0 16px;font-size:15px}
.btn.danger{background:#c8161d}
.btn:active{opacity:.85}
.btn:disabled{opacity:.5}

.login{max-width:520px;margin:0 auto;padding:36px 20px 60px;display:grid;gap:16px}
.login img{height:78px;width:auto;justify-self:center}
.login h1{text-align:center;font-size:28px;font-weight:800}
.login .err{background:#fde7e8;color:#8f0d12;padding:12px 14px;border-radius:3px;font-weight:700}
details{background:#fff;border-radius:3px;padding:12px 14px}
summary{font-weight:800;cursor:pointer}
details ol{margin:10px 0 0;padding-inline-start:20px;line-height:2}
code{background:#ececed;padding:1px 6px;border-radius:3px;font-size:14px;direction:ltr;display:inline-block}

.ab{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#000;color:#fff}
.ab b{font:700 20px 'Bodoni Moda',Georgia,serif;letter-spacing:.14em}
.ab span{opacity:.75;font-size:14px;flex:1}
.ab a,.ab button{color:#fff;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.4);padding:7px 12px;border-radius:3px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 12px 0;background:#ececed;position:sticky;top:55px;z-index:9;scrollbar-width:none}
.tabs button{flex:none;padding:12px 18px;font-weight:800;font-size:16px;border-bottom:3px solid transparent;color:#5d5d62}
.tabs button.on{color:#000;border-color:#000}
.pane{max-width:900px;margin:0 auto;padding:18px 14px 90px;display:grid;gap:14px}
.card{background:#fff;border-radius:4px;padding:16px;display:grid;gap:14px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.card h3{font-size:19px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#fff;padding:10px;border-radius:4px}
.row img{width:64px;height:80px;object-fit:cover;background:#ddd;border-radius:2px}
.row h4{margin:0;font-size:17px;font-weight:800;line-height:1.4}
.row .meta{font-size:13.5px;color:#5d5d62}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:#000;color:#fff;margin-inline-end:4px}
.pill.red{background:#c8161d}.pill.gray{background:#8b8b90}
.acts{display:flex;flex-direction:column;gap:6px}
.presets{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:grid;gap:10px}
.seg label{display:flex;align-items:center;gap:10px;font-weight:600}
.szgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.color{border:1.5px solid rgba(0,0,0,.18);padding:12px;border-radius:4px;display:grid;gap:12px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.th{position:relative;width:86px;height:108px;background:#ddd;border-radius:2px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#000;color:#fff;font-size:18px;line-height:26px}
.addimg{width:86px;height:108px;border:1.5px dashed #000;display:grid;place-items:center;font-weight:800;cursor:pointer;border-radius:2px;text-align:center;font-size:14px}
.link-danger{color:#c8161d;font-weight:800;justify-self:start}
.chk{display:flex;align-items:center;gap:10px;font-weight:600}
.ed-top{display:flex;align-items:center;gap:14px;padding:12px 14px;background:#000;color:#fff;position:sticky;top:0;z-index:10}
.ed-top button{color:#fff;font-weight:800}
.ed-bar{position:fixed;inset:auto 0 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(236,236,237,.95);border-top:1px solid rgba(0,0,0,.15);z-index:20}
.ed-bar .btn{max-width:880px;margin:0 auto;display:flex}
.fr{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:start;background:#fff;padding:10px;border-radius:4px}
.fr img{width:72px;height:90px;object-fit:cover;background:#ddd}
.fr .f{display:grid;gap:8px}
.fr .mv{display:flex;flex-direction:column;gap:6px}
#busy{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:grid;place-content:center;justify-items:center;gap:14px;color:#fff;font-weight:800}
.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:#000;color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;z-index:120;transition:transform .35s;max-width:92vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
#toast.bad{background:#c8161d}
@media (max-width:420px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div id="busy" hidden><div class="spin"></div><p id="busyTxt">جاري الحفظ…</p></div>
<div id="toast" role="status"></div>
<script src="admin.js"></script>
</body>
</html>
