<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOLO SUITS | سولو سوتس — بدل وأزياء رجالي ونسائي</title>
<meta name="description" content="SOLO SUITS — Style of Luxury Outfits. بدل وأزياء رجالي ونسائي في الإسكندرية.">
<meta name="theme-color" content="#ebebec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SOLO SUITS">

<!-- كل المسارات نسبية (بدون / في الأول) عشان الموقع يشتغل على أي حساب أو مستودع في GitHub -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">

<!-- الفيديو الافتتاحي: غيّر الملف assets/images/splash.mp4 بالفيديو الجديد وخلي نفس الاسم -->
<div id="splash" aria-hidden="true">
  <video id="splashVideo" muted playsinline webkit-playsinline autoplay preload="auto" poster="assets/images/splash-poster.jpg">
    <source src="assets/images/splash.mp4" type="video/mp4">
  </video>
  <img class="splash-logo" src="assets/images/logo-light.png" alt="">
</div>

<header class="topbar" id="topbar">
  <button class="iconbtn" id="btnMenu" aria-label="القائمة"></button>
  <a class="brand" href="#/" aria-label="SOLO SUITS — الرئيسية">
    <span class="brand-name">SOLO</span>
    <span class="brand-sub">SUITS</span>
  </a>
  <div class="topbar-end">
    <button class="iconbtn" id="btnSearch" aria-label="بحث"></button>
    <button class="iconbtn has-badge" id="btnCart" aria-label="السلة"><b class="badge" id="cartBadge" hidden>0</b></button>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<nav class="dock" id="dock" aria-label="تنقل سريع">
  <button data-dock="back"><i></i><span>رجوع</span></button>
  <button data-dock="home"><i></i><span>الرئيسية</span></button>
  <button data-dock="cart" class="has-badge"><i></i><span>السلة</span><b class="badge" id="dockBadge" hidden>0</b></button>
  <button data-dock="wa"><i></i><span>واتساب</span></button>
</nav>

<div class="scrim" id="scrim" hidden></div>

<aside class="sheet sheet-menu" id="menuSheet" aria-hidden="true" aria-label="القائمة"></aside>
<aside class="sheet sheet-cart" id="cartSheet" aria-hidden="true" aria-label="سلة المشتريات"></aside>

<div class="search" id="searchBox" hidden>
  <div class="search-bar">
    <input id="searchInput" type="search" placeholder="ابحث عن بدلة، قميص، فستان…" autocomplete="off" enterkeyhint="search">
    <button class="iconbtn" id="searchClose" aria-label="إغلاق"></button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="install" id="install" hidden>
  <img src="assets/images/icon-192.png" alt="" width="48" height="48">
  <div class="install-copy">
    <strong>تثبيت تطبيق SOLO SUITS الآن</strong>
    <span id="installHint">افتح المتجر بضغطة واحدة من الشاشة الرئيسية، وهيشتغل حتى بدون إنترنت.</span>
  </div>
  <div class="install-actions">
    <button class="btn btn-solid btn-sm" id="installYes">تثبيت</button>
    <button class="btn btn-line btn-sm" id="installLater">لاحقاً</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js" defer></script>
</body>
</html>
